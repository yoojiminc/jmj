<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Annoying Neighbours - Karel’s iPhone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }

    body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .phone {
      width: 375px;
      height: 812px;
      background: #000;
      border-radius: 48px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 11px #1c1c1e, 0 0 0 13px #333, 0 30px 60px rgba(0,0,0,0.7);
    }

    /* DYNAMIC ISLAND */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 37px;
      background: #000;
      border-radius: 20px;
      z-index: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    .dynamic-island.expanded {
      width: 200px;
      height: 80px;
      border-radius: 28px;
    }
    .island-content {
      color: white;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.2s;
      text-align: center;
      padding: 0 12px;
    }
    .dynamic-island.expanded .island-content {
      opacity: 1;
    }

    /* LOCK SCREEN */
    #lock-screen {
      position: absolute;
      inset: 0;
      background: url('jiminjeong_wallpaper.jpg') center/cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      z-index: 50;
      transition: 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      touch-action: none;
    }
    #lock-screen.unlocked { transform: translateY(-110%); }

    .status-bar {
      position: absolute;
      top: 14px;
      width: 100%;
      padding: 0 28px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
    }

    .lock-time {
      margin-top: 110px;
      font-size: 78px;
      font-weight: 200;
      letter-spacing: -3px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.45);
    }
    .lock-date {
      font-size: 20px;
      margin-top: -6px;
      opacity: 0.95;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }

    .lock-notif {
      margin-top: 40px;
      width: 88%;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(25px);
      border-radius: 18px;
      padding: 13px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      cursor: pointer;
    }
    .lock-notif img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
    }

    .swipe-hint {
      position: absolute;
      bottom: 45px;
      font-size: 14px;
      opacity: 0.85;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .swipe-arrow {
      font-size: 22px;
      animation: bounce 1.4s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* PASSCODE */
    #passcode {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(40px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 80;
      color: white;
    }
    .pass-title { font-size: 18px; margin-bottom: 12px; }
    .pass-hint { font-size: 13px; opacity: 0.7; margin-bottom: 28px; text-align: center; padding: 0 20px; }
    .dots { display: flex; gap: 20px; margin-bottom: 55px; }
    .dot {
      width: 15px; height: 15px;
      border: 1.8px solid white;
      border-radius: 50%;
      transition: 0.15s;
    }
    .dot.filled { background: white; }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      width: 290px;
    }

      width: 78px
